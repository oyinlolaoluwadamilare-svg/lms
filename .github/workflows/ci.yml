name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (includes the layering guardrail)
        run: npm run lint
      - name: Unit + permission + layering suites
        run: npm run test

  integration:
    runs-on: ubuntu-latest
    # src/data repositories are built on the Supabase JS client (PostgREST), not a raw Postgres
    # connection, so - unlike the rls job below - a bare local Postgres service container can't
    # stand in for it; this runs against the real hosted Supabase project (see
    # tests/integration/README.md). Requires the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repo
    # secrets to be configured - this job fails until they are.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Repository integration suite
        run: npm run test:integration

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PSQL_SUPERUSER_CMD: psql -h 127.0.0.1 -U postgres
      MIGRATOR_DATABASE_URL: postgres://app_migrator:migrator_local_dev@127.0.0.1:5432/pipeline_intelligence
      AUTHENTICATED_DATABASE_URL: postgres://authenticated:authenticated_local_dev@127.0.0.1:5432/pipeline_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Set up schema, RLS and the local auth shim (docs/05-test-strategy.md)
        run: npm run db:setup:local
      - name: RLS foundation suite
        run: npm run test:rls

  e2e:
    runs-on: ubuntu-latest
    # A pre-existing gap this job never had wired up, surfaced rather than quietly worked around:
    # tests/e2e/auth.spec.ts's reset-password test already round-trips a real call to Supabase
    # Auth, and tests/e2e/pipeline.spec.ts (M1.4) signs in as a real seeded user - both need the
    # same live project this job never had credentials for, plus a real browser-side anon key
    # (the integration job only ever uses the service-role client, so it never needed one). Three
    # repo secrets required: the two the `integration` job above already needs
    # (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) plus SUPABASE_ANON_KEY, new here - this job fails
    # until all three are configured.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed demo tenants (tests/e2e/pipeline.spec.ts signs in as a seeded user)
        run: npm run db:seed
      - name: Playwright e2e
        run: npm run test:e2e
